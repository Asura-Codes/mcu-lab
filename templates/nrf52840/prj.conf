# nRF52840 template - Kconfig fragments
# Board: promicro_nrf52840
# Build: cmake -B build -DBOARD=promicro_nrf52840 . && cmake --build build -j4

# GPIO subsystem (required for LED control)
CONFIG_GPIO=y

# Link at flash base for direct JTAG/OpenOCD debug reset flow.
CONFIG_FLASH_LOAD_OFFSET=0

# USB enabled, but initialize it from main() to avoid pre-main USB lockups.
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

# Set non-default VID/PID to avoid Zephyr USB test VID/PID warnings.
CONFIG_USB_DEVICE_VID=0x1209
CONFIG_USB_DEVICE_PID=0x5284

