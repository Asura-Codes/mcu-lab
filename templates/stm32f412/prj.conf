# WeAct STM32F412 template (Zephyr)
# Hardware: STM32F412RET6, 512 KiB flash, 256 KiB SRAM

CONFIG_FLASH_SIZE=512
CONFIG_SRAM_SIZE=256

CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_VID=0x0483
CONFIG_USB_DEVICE_PID=0xDF11

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Keep the app tiny and deterministic for first bring-up.
CONFIG_MAIN_STACK_SIZE=1024
