# STM32F411 template – Kconfig fragments
# Board: blackpill_f411ce  (WeAct BlackPill STM32F411CEU6)
# Build: cmake -B build -DBOARD=blackpill_f411ce . && cmake --build build -j4

CONFIG_GPIO=y

# Enable USB device stack and CDC-ACM (USB serial)
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y

# Route console/printk to the console backend (which will be the CDC ACM device)
CONFIG_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
# Lower default log level to reduce driver debug noise on CDC
# 3 = LOG_LEVEL_INF
CONFIG_LOG_DEFAULT_LEVEL=3

# Enable the UART console so the CDC ACM UART driver can be used
CONFIG_UART_CONSOLE=y

# Use the UART log backend (the CDC ACM node exposes a UART device)
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_AUTOSTART=y

# USB Device identity - override the Zephyr test defaults
# Replace these with your vendor's assigned IDs for production
CONFIG_USB_DEVICE_VID=0x0483
CONFIG_USB_DEVICE_PID=0x5740
CONFIG_USB_DEVICE_MANUFACTURER="WeAct"
CONFIG_USB_DEVICE_PRODUCT="BlackPill F411 CDC"

# Per-module USB log levels are controlled indirectly; use `CONFIG_LOG_DEFAULT_LEVEL` above.
